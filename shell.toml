# 0xHermes v2 shell palette. Keep the bar phosphor green; reserve rose for
# errors, warnings, and the active-window gradient.

[bar]
background       = "#020804"
background-alpha = 0.94
text             = "#39ff14"
active           = "#39ff14"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 26

[hyprland]
active-border            = "rgba(39ff14ee) rgba(ff2e63ee) 45deg"
active-border-foreground = "rgba(39ff14ee) rgba(ff2e63ee) 45deg"

[controls]
normal-color        = "#c7f5ce"
normal-fill-alpha   = 0.03
normal-border       = "#39ff14"
normal-border-width = 1
normal-border-alpha = 0.28

hover-cursor-color        = "#c7f5ce"
hover-cursor-fill-alpha   = 0.06
hover-cursor-border       = "#39ff14"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.20

focus-color        = "#c7f5ce"
focus-fill-alpha   = 0.06
focus-border       = "#39ff14"
focus-border-width = 1
focus-border-alpha = 0.25

selected-color        = "#39ff14"
selected-fill-alpha   = 0.14
selected-border       = "#39ff14"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.30

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#020804"
background-alpha = 1.0
text             = "#c7f5ce"
border           = "hyprland.active-border"
border-alpha     = 1.0

[tooltip]
background       = "#020804"
background-alpha = 0.97
text             = "#c7f5ce"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#020804"
background-alpha = 1.0
text             = "#c7f5ce"
border           = "hyprland.active-border"
border-alpha     = 1.0
countdown        = "#39ff14"

[launcher]
background                = "#020804"
background-alpha          = 0.95
text                      = "#c7f5ce"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#020804"
scrim-alpha               = 0.5
selected-background       = "#c7f5ce"
selected-background-alpha = 0.08
selected-text             = "#39ff14"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.25

[menu]
background                = "#020804"
background-alpha          = 1.0
text                      = "#c7f5ce"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#020804"
scrim-alpha               = 0.5
selected-background       = "#c7f5ce"
selected-background-alpha = 0.08
selected-text             = "#39ff14"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.25

[polkit]
background       = "#020804"
background-alpha = 1.0
text             = "#c7f5ce"
text-error       = "#ff2e63"
border           = "hyprland.active-border"
border-error     = "#ff2e63"
border-alpha     = 1.0
scrim            = "#020804"
scrim-alpha      = 0.5
accent           = "#39ff14"

[lock]
background       = "#020804"
background-alpha = 0.85
text             = "#c7f5ce"
placeholder      = "#83ff60"
text-error       = "#ff2e63"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#ff2e63"
border-alpha     = 1.0
selection        = "#39ff14"
selection-alpha  = 0.50

[image-picker]
scrim                   = "#020804"
scrim-alpha             = 0.5
text                    = "#c7f5ce"
selected-border         = "#39ff14"
selected-border-alpha   = 1.0
unselected-border       = "#c7f5ce"
unselected-border-alpha = 0.28
